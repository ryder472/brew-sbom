name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 go build -o dist/brew-sbom-darwin-amd64 ./cmd/brew-sbom
          GOOS=darwin GOARCH=arm64 go build -o dist/brew-sbom-darwin-arm64 ./cmd/brew-sbom
          GOOS=linux GOARCH=amd64 go build -o dist/brew-sbom-linux-amd64 ./cmd/brew-sbom
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
