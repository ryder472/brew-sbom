name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: |
          GOOS=darwin GOARCH=amd64 go build -o brew-sbom-darwin-amd64 ./cmd/brew-sbom
          GOOS=darwin GOARCH=arm64 go build -o brew-sbom-darwin-arm64 ./cmd/brew-sbom
          GOOS=linux GOARCH=amd64 go build -o brew-sbom-linux-amd64 ./cmd/brew-sbom
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            brew-sbom-darwin-amd64
            brew-sbom-darwin-arm64
            brew-sbom-linux-amd64
